<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="./style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet">
</head>
<body>
    <section id="hero">
        <div class="container">
            <div class="flex-lg-row-reverse align-items-center g-5 py-5 " style="height: 400px;">
                <h4 class="mt-5 white-color lato fw-light">GALLERY</h4>
                <h1 class="display-5 fw-bold lh-1 mb-3 white-color playfair-display ">FOOD LOVER</h1>
                <p class="lead white-color lato">A photo gallery of my favourite Nigerian dishes.</p>
            </div>
        </div>
    </section>

    <section id="pic-grid"> 
        <div class="container">
          
            <div class="row g-2 mt-2 mb-2">
                <div class="col-lg-8"><img src="./images/fried+rice.jpg" alt="fried rice picture" class=" w-100 h-100 object-fit-cover rounded"></div>
                <div class="col-lg-4"><img src="./images/egusi+soup.jpg" alt="egusi soup picture" class=" w-100 h-100 object-fit-cover rounded"></div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-lg-4"><img src="./images/white+rice+stew.jpg" alt="white rice and stew picture" class="w-100 h-100 object-fit-cover rounded"></div>
                <div class="col-lg-4"><img src="./images/Chicken+Peppersoup.jpg" alt="chicken pepper soup picture" class="w-100 h-100 object-fit-cover rounded"></div>
                <div class="col-lg-4"><img src="./images/Nigerian+jollof.jpg" alt="jollof rice picture" class="w-100 h-100 object-fit-cover rounded"></div>
            </div>
            
            <div class="row g-2">
                <div class="col-lg-4"><img src="./images/Spaghetti+and+Turkey.jpg" alt="Spaghetti and Turkey picture" class="w-100 h-100 object-fit-cover rounded"></div>
                <div class="col-lg-8"><img src="./images/vegetable+soup.jpg" alt="vegetable soup picture" class="w-100 h-100 object-fit-cover rounded"></div>
                </div>
                <p class="text-center lato">All images used on this website are gotten from pinterest, credits should be given to the original owners.</p>
        </div>  
      
    </section>

    <section id="footer">
        <div class="container">
            <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
                <div class="col-md-4 d-flex align-items-center"> <span class="mb-3 mb-md-0 text-body-secondary">© 2026 Michael Ndubuisi, All Rights Reserved.</span> </div>
            </footer>
        </div>

    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
